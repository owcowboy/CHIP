name = "chip-worker"
main = "src/index.ts"
compatibility_date = "2025-03-19"
compatibility_flags = ["nodejs_compat"]

# KV namespace — create with: wrangler kv namespace create CHIP_KV
[[kv_namespaces]]
binding = "CHIP_KV"
id = "efc639a1d6d44adfb0b7ef5552ee9740"

# Cron triggers
[triggers]
crons = [
  "30 7 * * *",   # 9h30 Paris (UTC+2 summer) — morning brief
  "0 11 * * *",   # 13h Paris — check-in mi-journée
  "0 16 * * *"    # 18h Paris — bilan soir
]

# Secrets (set via: wrangler secret put SECRET_NAME)
# ANTHROPIC_API_KEY
# NOTION_API_KEY
# NOTION_TASKS_DB_ID
# NOTION_DAILY_LOG_DB_ID
# NOTION_CONTEXT_DB_ID
# NOTION_WORKER_CONFIG_DB_ID   ← ID de la DB Worker Config (ac14f6a5-aacb-4742-ae0b-18fcd8cb7b74)
# TELEGRAM_BOT_TOKEN
# TELEGRAM_CHAT_ID

# Setup webhook Telegram (à faire une fois après deploy) :
# curl "https://api.telegram.org/bot<TELEGRAM_BOT_TOKEN>/setWebhook?url=https://<WORKER_URL>/telegram"
# Vérifier : curl "https://api.telegram.org/bot<TELEGRAM_BOT_TOKEN>/getWebhookInfo"
